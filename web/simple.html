<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RLab Network Topology Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1e1e1e; }
        #main { display: flex; height: 100vh; }
        #canvas-container { flex: 1; position: relative; }
        #sidebar { width: 300px; background: #252526; color: #fff; padding: 15px; }
        .toolbar { position: absolute; top: 10px; left: 10px; z-index: 100; }
        .toolbar button { margin-right: 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <div id="main">
        <div id="canvas-container">
            <div class="toolbar">
                <button onclick="exportJson()">Export</button>
                <button onclick="document.getElementById('fileInput').click()">Import</button>
                <input type="file" id="fileInput" accept=".json" onchange="importJson(this)" style="display:none">
            </div>
        </div>
        <div id="sidebar">
            <h3>Properties</h3>
            <div id="properties">Select a node</div>
        </div>
    </div>

    <script>
function registerNodes() {
    function InternetNode() {
        this.addOutput("out", 0);
        this.size = [140, 60];
        this.color = "#9b59b6";
    }
    LiteGraph.registerNodeType("network/internet", InternetNode);

    function RouterNode() {
        this.addInput("in", 0);
        this.addOutput("out", 0);
        this.size = [180, 100];
        this.color = "#e74c3c";
        this.properties = { name: "router", br: true };
    }
    LiteGraph.registerNodeType("network/router", RouterNode);

    function SwitchNode() {
        this.addInput("in", 0);
        this.addOutput("out", 0);
        this.size = [180, 100];
        this.color = "#3498db";
        this.properties = { name: "switch", br: true };
    }
    LiteGraph.registerNodeType("network/switch", SwitchNode);

    function PCNode() {
        this.addInput("in", 0);
        this.size = [160, 80];
        this.color = "#27ae60";
        this.properties = { name: "pc" };
    }
    LiteGraph.registerNodeType("network/pc", PCNode);
}

const graph = new LGraph();
const canvas = new LGraphCanvas("#canvas-container", graph);

registerNodes();

const internet = LiteGraph.createNode("network/internet");
internet.pos = [100, 200];
graph.add(internet);

function exportJson() {
    const data = graph.serialize();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "topology.json";
    a.click();
}

function importJson(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            graph.configure(data);
        } catch(err) {
            alert("Import failed: " + err.message);
        }
    };
    reader.readAsText(file);
}
    </script>
</body>
</html>
